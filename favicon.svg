<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9D3D"/>
      <stop offset="50%" stop-color="#E0670F"/>
      <stop offset="100%" stop-color="#B8500C"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE2CC"/>
      <stop offset="100%" stop-color="#E7C66B"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="24" fill="url(#saffronGrad)"/>
  <circle cx="50" cy="50" r="38" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.3"/>
  <circle cx="50" cy="50" r="34" fill="none" stroke="url(#goldGrad)" stroke-width="1.5"/>
  <!-- Hindi Letter 'स' (Sa for Samtawad) in stylized artistic glyph -->
  <text x="50" y="62" font-family="'Gotu', 'Rozha One', 'Alegreya Sans', serif, sans-serif" font-size="44" font-weight="700" fill="#FFFFFF" text-anchor="middle">स</text>
</svg>
